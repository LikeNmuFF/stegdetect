<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">StegDetect animated terminal preview</title>
  <desc id="desc">A clear animated terminal preview showing StegDetect dependency checks, QR scanning, steganography findings, suspicious text analysis, and report output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1418"/>
      <stop offset="52%" stop-color="#132224"/>
      <stop offset="100%" stop-color="#20392f"/>
    </linearGradient>
    <linearGradient id="terminal-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111c20"/>
      <stop offset="100%" stop-color="#182a2d"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <clipPath id="terminal-clip">
      <rect x="0" y="0" width="1080" height="360" rx="0"/>
    </clipPath>
    <style>
      .mono { font-family: "DejaVu Sans Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .title { fill: #e8fff0; font-size: 28px; font-weight: 800; }
      .subtitle { fill: #96b7a7; font-size: 15px; }
      .path { fill: #9ab8ad; font-size: 14px; }
      .line { fill: #d8f3dc; font-size: 15px; opacity: 1; }
      .dim { fill: #91a79c; }
      .ok { fill: #75dda2; }
      .warn { fill: #ffd166; }
      .high { fill: #ff7373; }
      .cyan { fill: #7bdff2; }
      .bar-label { fill: #9ab8ad; font-size: 13px; }
      .cursor { animation: blink 1s steps(2, start) infinite; }
      @keyframes blink {
        0%, 45% { opacity: 1; }
        46%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>

  <g transform="translate(64 48)">
    <text class="mono title" x="0" y="0">StegDetect</text>
    <text class="mono subtitle" x="0" y="28">Steganography scanner for images, text, audio, QR payloads, and suspicious encoded strings</text>
  </g>

  <g transform="translate(64 102)" filter="url(#shadow)">
    <rect width="1072" height="386" rx="14" fill="#071013" stroke="#29453d"/>
    <rect width="1072" height="42" rx="14" fill="url(#terminal-bar)"/>
    <rect y="28" width="1072" height="14" fill="#142527"/>
    <circle cx="24" cy="21" r="6" fill="#ff6b6b"/>
    <circle cx="45" cy="21" r="6" fill="#ffd166"/>
    <circle cx="66" cy="21" r="6" fill="#75dda2"/>
    <text class="mono path" x="96" y="27">/usr/local/bin/stegdetect</text>

    <g transform="translate(30 68)" clip-path="url(#terminal-clip)">
      <text class="mono line cyan" x="0" y="0">$ stegdetect --output reports evidence/
        <animate attributeName="opacity" values="0.45;1;1" keyTimes="0;0.06;1" dur="9s" repeatCount="indefinite"/>
      </text>

      <text class="mono line dim" x="0" y="36">==== Dependency check ====
        <animate attributeName="opacity" values="0.30;0.30;1;1" keyTimes="0;0.08;0.14;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text class="mono line ok" x="0" y="62">[ok] file  python3  strings  exiftool  zbarimg
        <animate attributeName="opacity" values="0.30;0.30;1;1" keyTimes="0;0.14;0.20;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text class="mono line ok" x="0" y="88">[ok] zsteg  jsteg  binwalk  steghide  sox
        <animate attributeName="opacity" values="0.30;0.30;1;1" keyTimes="0;0.20;0.26;1" dur="9s" repeatCount="indefinite"/>
      </text>

      <text class="mono line dim" x="0" y="128">--- QR code scan ---
        <animate attributeName="opacity" values="0.30;0.30;1;1" keyTimes="0;0.28;0.34;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text class="mono line warn" x="0" y="154">QR-Code: https://example.test/drop
        <animate attributeName="opacity" values="0.30;0.30;1;1" keyTimes="0;0.34;0.40;1" dur="9s" repeatCount="indefinite"/>
      </text>

      <text class="mono line dim" x="0" y="194">--- zsteg ---
        <animate attributeName="opacity" values="0.30;0.30;1;1" keyTimes="0;0.42;0.48;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text class="mono line warn" x="0" y="220">b1,b,lsb,xy .. hidden printable text found
        <animate attributeName="opacity" values="0.30;0.30;1;1" keyTimes="0;0.48;0.54;1" dur="9s" repeatCount="indefinite"/>
      </text>

      <text class="mono line dim" x="0" y="260">--- suspicious text analysis ---
        <animate attributeName="opacity" values="0.30;0.30;1;1" keyTimes="0;0.56;0.62;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text class="mono line high" x="0" y="286">[high] base64 decodes to shell text
        <animate attributeName="opacity" values="0.30;0.30;1;1" keyTimes="0;0.62;0.68;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text class="mono line ok" x="0" y="312">Report: reports/stegdetect_report_evidence.txt
        <animate attributeName="opacity" values="0.30;0.30;1;1" keyTimes="0;0.70;0.78;1" dur="9s" repeatCount="indefinite"/>
      </text>

      <rect class="cursor" x="0" y="331" width="10" height="18" fill="#d8f3dc">
        <animate attributeName="x" values="0;0;410;410;0" keyTimes="0;0.76;0.86;0.94;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <g transform="translate(64 518)">
    <text class="mono bar-label" x="0" y="0">safe decode previews, no payload execution</text>
    <rect x="330" y="-11" width="746" height="7" rx="4" fill="#203a35"/>
    <rect x="330" y="-11" width="80" height="7" rx="4" fill="#75dda2">
      <animate attributeName="width" values="80;230;430;746;80" keyTimes="0;0.28;0.56;0.82;1" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
